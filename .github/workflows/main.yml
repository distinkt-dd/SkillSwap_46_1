# Простой workflow для развёртывания статического содержимого на GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: 
      - main
      - master  # если у вас ветка называется master
  pull_request:
    branches: 
      - main
      - master
  # Позволяет запустить этот рабочий процесс вручную на вкладке Actions tab
  workflow_dispatch:
  
# Устанавливает права GITHUB_TOKEN, чтобы разрешить развёртывание на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  PUBLIC_PATH: /SkillSwap_46_1/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci  # Используйте npm ci для более быстрой и надежной установки
      - name: Run test
        run: npm test
      - name: Run build test
        run: npm run build

  deploy:
    needs: test  # Деплой только после успешных тестов
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Деплой только при push в main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
